<head>

    <link rel="icon" type="image/png" href="https://i.ibb.co.com/qLz5Xk4t/PROJEKITA-5.png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* Background image lama dihapus, diganti peta leaflet */
            -webkit-tap-highlight-color: transparent;
        }

        .orange-gradient {
            background: linear-gradient(135deg, #ff8c00 0%, #ff5e00 100%);
        }

        .dark-gradient {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }

        /* Gold Gradient for Top 1 */
        .gold-gradient {
            background: linear-gradient(135deg, #ffd700 0%, #ffb900 100%);
        }
        
        .card-shadow {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }

        .progress-bar {
            height: 8px;
            border-radius: 4px;
            background: #e2e8f0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #ff8c00;
            transition: width 0.3s ease;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #22c55e; }
        input:checked + .slider:before { transform: translateX(26px); }
        /* Tambahan untuk switch yang dinonaktifkan saat tidak ada sinyal */
        input:disabled + .slider { background-color: #e2e8f0; cursor: not-allowed; }
        input:disabled + .slider:before { background-color: #94a3b8; }

        .hidden-page { display: none !important; }

        #loading-overlay {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        #login-page {
            position: fixed;
            inset: 0;
            background: #f8fafc;
            z-index: 150;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .refreshing {
            animation: spin-slow 1s linear infinite;
        }

        #help-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* MODAL RULES BARU */
        #rules-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 210; /* Lebih tinggi dari welcome popup */
            display: none; 
            align-items: flex-end; /* Mobile bottom sheet style */
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #rules-modal.active {
            display: flex;
            opacity: 1;
        }
        #rules-content-box {
            background: white;
            width: 100%;
            height: 90vh; /* Hampir full screen */
            border-radius: 24px 24px 0 0;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);

            max-width: 600px;
            margin: 0 auto;
        }
        #rules-modal.active #rules-content-box {
            transform: translateY(0);
        }

        .trip-card {
            background: white;
            border-radius: 20px;

        #swipe-btn, #offbid-swipe-btn { touch-action: none; will-change: left; }

        .custom-scrollbar::-webkit-scrollbar-track {

        }
        .custom-scrollbar::-webkit-scrollbar-thumb {

        /* Checkbox Styling */
        .commitment-checkbox {
            appearance: none;

            border-color: #ff8c00;

            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: white;
            font-size: 0.75rem;

            top: 50%;

        /* ANIMASI SEMUT UNTUK BINTANG 1 */
        @keyframes ant-crawl {

            25% { transform: translate(15px, -15px) rotate(45deg); }

        .ant-swarm {

        .menu-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 1rem;

            20% { transform: rotate(-10deg); }
            30% { transform: rotate(5deg); }
            40% { transform: rotate(-5deg); }
            50% { transform: rotate(0); }
            100% { transform: rotate(0); }

        .animate-ring-bell { animation: ring-bell 2s infinite; }

        /* DARK MODE - GLOBAL OVERRIDES */

        body.dark-mode { background-color: #0f172a !important; background-blend-mode: multiply; color: #f8fafc !important; color-scheme: dark; }
        body.dark-mode .bg-white { background-color: #1e293b !important; border-color: #334155 !important; color: #f8fafc; }
        body.dark-mode .bg-gray-50 { background-color: #0f172a !important; border-color: #1e293b !important; color: #f8fafc; }

        /* PENGECUALIAN UNTUK NOTA (Harus Tetap Terang agar bisa di-download putih) */

<body class="pb-24"> 

    <!-- BACKGROUND UMUM UNTUK HALAMAN SELAIN BERANDA -->
    <div id="general-bg" class="fixed inset-0 z-[-3] bg-cover bg-center bg-no-repeat transition-opacity duration-300 opacity-0" style="background-image: url('https://i.ibb.co.com/BKfzrDpr/5e893afb7790c0f5c0f18ee6d7d39460.jpg');"></div>
    <!-- MAP BACKGROUND (LEAFLET STATIS HEMAT DAYA) -->
    <div id="map-background" class="fixed inset-0 z-[-2] pointer-events-none transition-opacity duration-300 opacity-100"></div>
    <!-- OVERLAY KACA AGAR UI TETAP TERBACA (Efek blur dihilangkan agar peta terlihat tajam) -->
    <div id="map-overlay" class="fixed inset-0 z-[-1] bg-white/60 pointer-events-none transition-colors duration-300"></div>

    <!-- Halaman Login -->
    <div id="login-page">
        <div class="w-full max-sm space-y-8 text-center">
            <div class="space-y-2">
                <div class="w-20 h-20 orange-gradient rounded-3xl flex items-center justify-center text-white text-3xl mx-auto shadow-lg mb-4">
                    <i class="fa-solid fa-motorcycle"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Masuk Rider</h2>
                <p class="text-sm text-gray-500 px-8">Masukkan ID unik Anda untuk mengakses dashboard pendapatan</p>
            </div>
            
            <!-- BAGIAN UID INPUT -->
            <div id="login-input-section" class="space-y-4">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
                        <i class="fa-solid fa-user-tag"></i>
                    </span>
                    <input type="text" id="uid-input" placeholder="Masukkan UID Anda..." class="w-full pl-12 pr-4 py-4 bg-white border border-gray-100 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500 font-bold text-gray-800 uppercase">
                </div>
                <button onclick="handleLogin()" id="login-btn" class="w-full py-4 orange-gradient text-white font-bold rounded-2xl shadow-lg transform active:scale-95 transition-all">
                    Buka Dashboard
                </button>

            <!-- BAGIAN PIN KEAMANAN (BARU) -->
            <div id="pin-section" class="hidden space-y-4 w-full mt-4">

                </div>
                <div class="relative flex justify-center">
                    <input type="password" id="pin-input" inputmode="numeric" maxlength="6" class="w-full text-center tracking-[1em] text-3xl py-4 bg-white border border-gray-200 rounded-2xl shadow-inner focus:outline-none focus:ring-2 focus:ring-orange-500 font-black text-gray-800" placeholder="••••••">
                </div>
                <div id="pin-error-msg" class="hidden text-red-500 text-xs font-bold bg-red-50 p-3 rounded-xl border border-red-100 mt-2">PIN Salah!</div>
                <div class="flex space-x-3 mt-6">
                    <button onclick="window.cancelPin()" class="w-1/3 py-4 bg-gray-100 text-gray-600 font-bold rounded-2xl active:scale-95 transition-all text-sm border border-gray-200">Batal</button>
                    <button onclick="window.submitPin()" id="submit-pin-btn" class="w-2/3 py-4 orange-gradient text-white font-bold rounded-2xl shadow-lg active:scale-95 transition-all text-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-unlock-keyhole"></i> Lanjut
                    </button>
                </div>
            </div>

            <div id="login-error-msg" class="hidden text-red-500 text-xs font-bold bg-red-50 p-3 rounded-xl border border-red-100">
                UID tidak ditemukan atau salah.
            </div>
            
            <p class="text-[10px] text-gray-400 uppercase tracking-widest mt-8">© 2026 PROJEKGO Rider Management System</p>
        </div>
    </div>

    <!-- POPUP BLOKIR BROWSER -->
    <div id="block-browser-popup" class="fixed inset-0 z-[9999999] bg-gray-900 flex-col items-center justify-center p-6 text-center hidden">
        <!-- Konten Popup Blokir -->
    </div>

    <!-- Layout Utama Aplikasi akan muncul di sini (Tersalin dari versi sebelumnya) -->
    <div id="main-app" class="hidden">
        <!-- Banner Peringatan, Header, Main Content, Footer dsb... -->
    </div>

    <!-- Script loading dan logika dasar (Sama dengan sebelumnya) -->
    <div id="loading-overlay">
        <!-- Loader Content -->
    </div>

    <script>
        // Logika Global & UI Helper (Sama seperti sebelumnya)
        // ... (Kode toggleSidebar, switchPage, playBeep, formatCurrencyInput, dsb)
        
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMX_0oMNiabxeDHJfRHHYkuyQDxvNafLwDg6IPRFN3C8IHjAknXERfPG_UKCZU2ljG/exec";
        const PROFILE_DOCS_URL = "https://script.google.com/macros/s/AKfycbx-L15ePYQPSFaTY6wvn4wfC0DtwqJNVzEVTAFoq-bw8eFEr_HNYxLMJTPPC6aHv9paNA/exec";

        let currentUserUID = "";
        let rawData = [];

        // --- FUNGSI LOGIN UTAMA ---
        async function handleLogin() {
            const input = document.getElementById('uid-input'); 
            const errorMsg = document.getElementById('login-error-msg');
            const uid = input.value.trim().toUpperCase();
            
            if (!uid) { errorMsg.innerText = "Silakan masukkan UID Anda."; errorMsg.classList.remove('hidden'); return; }
            errorMsg.classList.add('hidden'); 
            
            const btn = document.getElementById('login-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Memverifikasi...';
            btn.disabled = true;

            try {
                // 1. Verifikasi UID ke Google Script / Database
                const response = await fetch(`${SCRIPT_URL}?t=${Date.now()}`);
                const data = await response.json();
                const items = Array.isArray(data) ? data : [];
                
                const validRider = items.find(item => item && item.UID && String(item.UID).trim().toUpperCase() === uid);

                if (!validRider) {
                    errorMsg.innerText = `UID "${uid}" tidak terdaftar.`; 
                    errorMsg.classList.remove('hidden');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    return;
                }

                // 2. Jika UID Valid, Cek PIN di Firebase
                currentUserUID = uid;
                if (window.checkRiderPin) {
                    window.checkRiderPin(uid);
                } else {
                    // Fallback jika Firebase belum siap
                    window.proceedWithLogin(uid);
                }
                
            } catch (error) {
                console.error("Login Error:", error);
                errorMsg.innerText = "Gagal terhubung ke server."; 
                errorMsg.classList.remove('hidden');
            }
            btn.innerHTML = originalText;
            btn.disabled = false;
        }

        window.proceedWithLogin = function(uid) {
            currentUserUID = uid;
            localStorage.setItem('rider_uid', currentUserUID); 
            
            // Trigger Listeners (Firebase Module)
            if (typeof window.startSuspensionListener === 'function') window.startSuspensionListener(uid);
            if (typeof window.startOrderListener === 'function') window.startOrderListener(uid);
            
            document.getElementById('login-page').style.display = 'none'; 
            document.getElementById('loading-overlay').style.display = 'flex';
            
            // Panggil fungsi fetchData() yang ada di script utama (Sama dengan versi sebelumnya)
            if (typeof fetchData === 'function') fetchData();
        }
        
        window.cancelPin = () => {
            document.getElementById('pin-section').classList.add('hidden');
            document.getElementById('login-input-section').classList.remove('hidden');
            document.getElementById('pin-input').value = '';
            document.getElementById('pin-error-msg').classList.add('hidden');
        };

    </script>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBCp2PBN1ASET6QjuQ3PWdC1gysQv0z_OY",
            authDomain: "onbid-2f87a.firebaseapp.com",
            projectId: "onbid-2f87a",
            storageBucket: "onbid-2f87a.firebasestorage.app",
            messagingSenderId: "223888282484",
            appId: "1:223888282484:web:2fc05ed67ca1fab39e1221"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (user) { window.isFirebaseReady = true; }
        });
        signInAnonymously(auth);

        // --- PENGGANTI SISTEM LOGIN: UID -> PIN ---
        window.checkRiderPin = async (uid) => {
            try {
                const targetProjectId = firebaseConfig.projectId;
                const pinRef = doc(db, 'artifacts', targetProjectId, 'users', String(uid).trim().toUpperCase(), 'security', 'pin_data');
                const pinSnap = await getDoc(pinRef);
                
                document.getElementById('login-input-section').classList.add('hidden');
                document.getElementById('pin-section').classList.remove('hidden');
                document.getElementById('pin-error-msg').classList.add('hidden');
                
                if (pinSnap.exists() && pinSnap.data().pin) {
                    // MODE VERIFIKASI
                    window.currentLoginMode = 'verify';
                    window.expectedPin = pinSnap.data().pin;
                    document.getElementById('pin-title').innerText = "Masukkan PIN";
                    document.getElementById('pin-desc').innerText = "Akun terdeteksi, masukkan 6 digit PIN Anda.";
                } else {
                    // MODE BUAT BARU (Langsung tanpa plat motor)
                    window.currentLoginMode = 'create';
                    document.getElementById('pin-title').innerText = "Buat PIN Baru";
                    document.getElementById('pin-desc').innerText = "PIN belum terdaftar. Silakan buat 6 digit PIN untuk keamanan akun Anda.";
                }
                
                document.getElementById('pin-input').value = '';
                setTimeout(() => { document.getElementById('pin-input').focus(); }, 100);
                
            } catch (error) {
                console.error("PIN Check Error:", error);
                window.proceedWithLogin(uid);
            }
        };

        window.submitPin = async () => {
            const inputVal = document.getElementById('pin-input').value;
            const errorMsg = document.getElementById('pin-error-msg');
            const uid = document.getElementById('uid-input').value.trim().toUpperCase();
            const btn = document.getElementById('submit-pin-btn');
            
            if (inputVal.length !== 6 || isNaN(inputVal)) {
                errorMsg.innerText = "PIN harus tepat 6 digit angka!";
                errorMsg.classList.remove('hidden');
                return;
            }
            
            errorMsg.classList.add('hidden');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i>';
            btn.disabled = true;
            
            if (window.currentLoginMode === 'verify') {
                if (inputVal === window.expectedPin) {
                    window.proceedWithLogin(uid);
                } else {
                    errorMsg.innerText = "PIN Salah! Silakan coba lagi.";
                    errorMsg.classList.remove('hidden');
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                }
            } else if (window.currentLoginMode === 'create') {
                try {
                    const targetProjectId = firebaseConfig.projectId;
                    const pinRef = doc(db, 'artifacts', targetProjectId, 'users', uid, 'security', 'pin_data');
                    await setDoc(pinRef, {
                        pin: inputVal,
                        created_at: serverTimestamp()
                    });
                    window.proceedWithLogin(uid);
                } catch(e) {
                    console.error(e);
                    errorMsg.innerText = "Gagal menyimpan PIN.";
                    errorMsg.classList.remove('hidden');
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                }
            }
        };
    </script>
</body>
</html>
