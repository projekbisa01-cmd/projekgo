<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Kendala Rider</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        .toast-leave { animation: fadeOut 0.3s ease-in forwards; }
        @keyframes slideIn {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .accordion-content { transition: max-height 0.3s ease-in-out, padding 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen pb-10">

    <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Pusat Bantuan Rider
            </h1>
            <button onclick="openAdminModal()" id="btn-admin-login" class="text-sm bg-emerald-700 hover:bg-emerald-800 px-3 py-1.5 rounded-full transition-colors">
                Admin
            </button>
            <button onclick="logoutAdmin()" id="btn-admin-logout" class="hidden text-sm bg-red-500 hover:bg-red-600 px-3 py-1.5 rounded-full transition-colors">
                Keluar Admin
            </button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-6">
        
        <!-- Search Bar -->
        <div class="relative mb-6">
            <input type="text" id="search-input" onkeyup="filterFAQs()" placeholder="Cari kendala (cth: penambahan ongkir, aplikasi error)..." class="w-full pl-10 pr-4 py-3 rounded-xl border-gray-300 shadow-sm focus:border-emerald-500 focus:ring focus:ring-emerald-200 outline-none w-full border">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400 absolute left-3 top-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        </div>

        <!-- Panel Tambah FAQ (Hanya untuk Admin) -->
        <div id="admin-panel" class="hidden mb-8 bg-white p-5 rounded-xl shadow-md border-l-4 border-emerald-500">
            <h2 class="text-lg font-bold mb-3">Tambah Kendala Baru</h2>
            <div class="space-y-3">
                <input type="text" id="new-question" placeholder="Pertanyaan / Kendala..." class="w-full p-2 border border-gray-300 rounded focus:border-emerald-500 outline-none">
                <div class="relative">
                    <textarea id="new-answer" rows="4" placeholder="Jawaban / Solusi..." class="w-full p-2 border border-gray-300 rounded focus:border-emerald-500 outline-none"></textarea>
                    <button onclick="insertBullet()" class="absolute right-2 bottom-3 text-xs bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded text-gray-700">
                        + Tambah Bullet Poin
                    </button>
                </div>
                <button onclick="addFAQ()" id="btn-save-faq" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-lg transition">
                    Simpan FAQ
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading-indicator" class="text-center py-10">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-600 mx-auto mb-2"></div>
            <p class="text-gray-500">Memuat data kendala...</p>
        </div>

        <!-- Daftar FAQ -->
        <div id="faq-container" class="space-y-3 hidden">
            <!-- Konten FAQ akan dirender di sini via JavaScript -->
        </div>

        <!-- State Kosong / Tidak ditemukan -->
        <div id="empty-state" class="hidden text-center py-10">
            <p class="text-gray-500">Belum ada data FAQ atau pencarian tidak ditemukan.</p>
        </div>
    </main>

    <!-- Modal Login Admin -->
    <div id="admin-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center backdrop-blur-sm px-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-sm p-6 transform scale-95 transition-transform duration-200">
            <h3 class="text-lg font-bold mb-4">Akses Admin</h3>
            <input type="text" id="admin-username" placeholder="Username" class="w-full mb-3 p-2 border rounded outline-none focus:border-emerald-500">
            <input type="password" id="admin-password" placeholder="Password" class="w-full mb-4 p-2 border rounded outline-none focus:border-emerald-500">
            <p id="login-error" class="text-red-500 text-sm hidden mb-3">Username atau Password salah!</p>
            <div class="flex justify-end gap-2">
                <button onclick="closeAdminModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Batal</button>
                <button onclick="processLogin()" class="px-4 py-2 bg-emerald-600 text-white rounded hover:bg-emerald-700">Login</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification (Pengganti Alert) -->
    <div id="toast-container" class="fixed top-20 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Firebase dan Logika Aplikasi -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Konfigurasi Firebase Milik Anda
        const firebaseConfig = {
            apiKey: "AIzaSyD7nu9_pM1ijB66h1oWJdc4Dxn9HDFE8Do",
            authDomain: "kendala-operasional.firebaseapp.com",
            projectId: "kendala-operasional",
            storageBucket: "kendala-operasional.firebasestorage.app",
            messagingSenderId: "408615147569",
            appId: "1:408615147569:web:cd5486ecf940dd89849d10"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Path Referensi Single Document (SANGAT HEMAT KUOTA)
        // Menyimpan semua FAQ dalam 1 dokumen bernama 'master_list' di dalam koleksi 'faq_data'
        const masterDocRef = doc(db, 'faq_data', 'master_list');

        // State Aplikasi
        let faqs = [];
        let isAdmin = false;
        let activeAccordion = null;

        // TEKNIK ONE-TIME FETCH (Ambil data sekali saja saat aplikasi dimuat)
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const docSnap = await getDoc(masterDocRef);
                    if (docSnap.exists()) {
                        // Ambil array dari dalam dokumen
                        faqs = docSnap.data().faqs || [];
                    } else {
                        faqs = [];
                    }
                    renderFAQs();
                } catch (error) {
                    console.error("Gagal mengambil data:", error);
                    showToast("Gagal memuat data dari server.", "error");
                    // Sembunyikan loading jika gagal
                    document.getElementById('loading-indicator').classList.add('hidden');
                }
            }
        });

        // Login Anonim Otomatis
        signInAnonymously(auth).catch((error) => {
            console.error("Auth Anonim Gagal:", error);
            showToast("Sistem gagal terhubung, coba muat ulang halaman.", "error");
        });

        // --- Fungsi Logika UI ---
        
        window.renderFAQs = (filterText = "") => {
            const container = document.getElementById('faq-container');
            const loading = document.getElementById('loading-indicator');
            const emptyState = document.getElementById('empty-state');
            
            loading.classList.add('hidden');
            container.innerHTML = ''; // Bersihkan container

            // Filter data berdasarkan pencarian
            const filteredFaqs = faqs.filter(faq => 
                faq.question.toLowerCase().includes(filterText.toLowerCase()) || 
                faq.answer.toLowerCase().includes(filterText.toLowerCase())
            );

            if (filteredFaqs.length === 0) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            container.classList.remove('hidden');
            emptyState.classList.add('hidden');

            filteredFaqs.forEach((faq) => {
                const faqHTML = `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <button onclick="toggleAccordion(${faq.id})" class="w-full px-5 py-4 text-left flex justify-between items-center focus:outline-none hover:bg-gray-50 transition">
                            <span class="font-semibold text-gray-800 pr-4">${faq.question}</span>
                            <svg id="icon-${faq.id}" class="h-5 w-5 text-gray-500 transform transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <div id="content-${faq.id}" class="max-h-0 overflow-hidden accordion-content bg-gray-50">
                            <div class="px-5 py-4 text-gray-600 text-sm whitespace-pre-wrap border-t border-gray-100">${faq.answer}</div>
                            ${isAdmin ? `
                                <div class="px-5 pb-4 flex justify-end">
                                    <button onclick="deleteFAQ(${faq.id})" class="text-xs bg-red-100 text-red-600 px-3 py-1.5 rounded hover:bg-red-200 flex items-center gap-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                        Hapus
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', faqHTML);
            });
        };

        window.toggleAccordion = (id) => {
            const content = document.getElementById(`content-${id}`);
            const icon = document.getElementById(`icon-${id}`);

            // Tutup accordion yang sedang terbuka (jika ada)
            if (activeAccordion && activeAccordion !== id) {
                const oldContent = document.getElementById(`content-${activeAccordion}`);
                const oldIcon = document.getElementById(`icon-${activeAccordion}`);
                if (oldContent && oldIcon) {
                    oldContent.style.maxHeight = null;
                    oldIcon.classList.remove('rotate-180');
                }
            }

            // Buka atau tutup accordion yang diklik
            if (content.style.maxHeight) {
                content.style.maxHeight = null;
                icon.classList.remove('rotate-180');
                activeAccordion = null;
            } else {
                content.style.maxHeight = content.scrollHeight + "px";
                icon.classList.add('rotate-180');
                activeAccordion = id;
            }
        };

        window.filterFAQs = () => {
            const searchText = document.getElementById('search-input').value;
            renderFAQs(searchText);
        };

        // --- Operasi CRUD ke Firebase ---

        window.addFAQ = async () => {
            const qInput = document.getElementById('new-question');
            const aInput = document.getElementById('new-answer');
            const btnSave = document.getElementById('btn-save-faq');

            const question = qInput.value.trim();
            const answer = aInput.value.trim();

            if (!question || !answer) {
                showToast("Pertanyaan dan Jawaban harus diisi!", "error");
                return;
            }

            // Loading state tombol
            btnSave.innerHTML = "Menyimpan...";
            btnSave.disabled = true;

            const newId = Date.now();
            const newFaq = { id: newId, question: question, answer: answer };
            
            try {
                faqs.push(newFaq); // Tambah ke array lokal
                
                // Simpan seluruh array ke 1 dokumen di Firebase
                await setDoc(masterDocRef, { faqs: faqs });
                
                renderFAQs();
                qInput.value = '';
                aInput.value = '';
                showToast("FAQ berhasil ditambahkan!", "success");
            } catch (error) {
                console.error("Gagal menyimpan:", error);
                faqs.pop(); // Batalkan jika gagal
                showToast("Gagal menyimpan ke database.", "error");
            } finally {
                btnSave.innerHTML = "Simpan FAQ";
                btnSave.disabled = false;
            }
        };

        window.deleteFAQ = async (id) => {
            // Kita pakai confirm kustom lewat HTML jika mau, tapi untuk kesederhanaan 
            // karena instruksi melarang alert()/confirm(), kita langsung hapus dan beri notif.
            const previousFaqs = [...faqs];
            
            try {
                faqs = faqs.filter(faq => faq.id !== id); // Hapus dari lokal
                
                // Update array di Firebase
                await setDoc(masterDocRef, { faqs: faqs });
                
                renderFAQs();
                showToast("FAQ berhasil dihapus.", "success");
            } catch (error) {
                console.error("Gagal menghapus:", error);
                faqs = previousFaqs; // Kembalikan data jika gagal
                showToast("Gagal menghapus data.", "error");
            }
        };

        // --- Fungsi Pembantu (Admin & Toast) ---

        window.insertBullet = () => {
            const textarea = document.getElementById('new-answer');
            textarea.value += '\n• ';
            textarea.focus();
        };

        window.openAdminModal = () => {
            document.getElementById('admin-modal').classList.remove('hidden');
        };

        window.closeAdminModal = () => {
            document.getElementById('admin-modal').classList.add('hidden');
            document.getElementById('login-error').classList.add('hidden');
            document.getElementById('admin-password').value = '';
        };

        window.processLogin = () => {
            const user = document.getElementById('admin-username').value;
            const pass = document.getElementById('admin-password').value;
            const errorMsg = document.getElementById('login-error');

            // Hardcode kredensial Admin demi kepraktisan
            if (user === 'Admin123' && pass === '987654') {
                isAdmin = true;
                closeAdminModal();
                
                // Tampilkan panel admin
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('btn-admin-login').classList.add('hidden');
                document.getElementById('btn-admin-logout').classList.remove('hidden');
                
                renderFAQs(); // Render ulang untuk memunculkan tombol hapus
                showToast("Berhasil login sebagai Admin", "success");
            } else {
                errorMsg.classList.remove('hidden');
            }
        };

        window.logoutAdmin = () => {
            isAdmin = false;
            document.getElementById('admin-panel').classList.add('hidden');
            document.getElementById('btn-admin-login').classList.remove('hidden');
            document.getElementById('btn-admin-logout').classList.add('hidden');
            
            renderFAQs(); // Render ulang untuk menyembunyikan tombol hapus
            showToast("Anda telah keluar dari mode Admin", "success");
        };

        // Custom Toast Notification Function (Pengganti alert)
        window.showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgColor = type === 'success' ? 'bg-emerald-600' : 'bg-red-500';
            
            toast.className = `${bgColor} text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-2 toast-enter`;
            toast.innerHTML = `
                <span>${message}</span>
            `;
            
            container.appendChild(toast);
            
            // Hapus otomatis setelah 3 detik
            setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-leave');
                setTimeout(() => {
                    toast.remove();
                }, 300); // Tunggu animasi selesai
            }, 3000);
        };
    </script>
</body>
</html>
