<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer Rider</title>
<style>
  :root{
    --bg:#F6F5F1;
    --panel:#FFFFFF;
    --ink:#1B1E23;
    --sub:#6B7078;
    --line:#E4E2DB;
    --navy:#1F3B57;
    --navy-dim:#2C4A69;
    --green:#2E7D5B;
    --green-bg:#E8F3EC;
    --amber:#B5750A;
    --amber-bg:#FBF1DF;
    --red:#B23A2E;
    --red-bg:#FBEAE7;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html,body{margin:0;padding:0;background:var(--bg);}
  *{box-sizing:border-box;}
  #tf-root{
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    padding:18px 14px 60px;
    max-width:640px;
    margin:0 auto;
  }
  .tf-h1{font-size:20px;font-weight:700;margin:0 0 2px;letter-spacing:-0.01em;}
  .tf-sub{font-size:13px;color:var(--sub);margin:0 0 16px;}
  .tf-topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;}
  .tf-session-label{font-size:14px;font-weight:600;color:var(--navy);}
  .tf-btn{
    border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;
  }
  .tf-btn:hover{border-color:var(--navy);}
  .tf-btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .tf-btn.primary:disabled{background:#B9C3CC;border-color:#B9C3CC;cursor:not-allowed;}
  .tf-btn.ghost{background:transparent;border-color:transparent;color:var(--sub);padding:6px 8px;}
  .tf-btn.danger{color:var(--red);border-color:var(--red-bg);background:var(--red-bg);}
  .tf-btn.small{padding:5px 9px;font-size:12px;border-radius:6px;}

  .tf-steps{display:flex;gap:4px;margin-bottom:16px;}
  .tf-step{flex:1;text-align:center;font-size:11px;font-weight:600;color:var(--sub);
    padding:7px 2px;border-bottom:3px solid var(--line);}
  .tf-step.active{color:var(--navy);border-color:var(--navy);}
  .tf-step.done{color:var(--green);border-color:var(--green);}

  .tf-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .tf-row{display:grid;grid-template-columns:1fr 1.3fr 0.8fr 1fr 1fr 0.8fr auto;gap:6px;align-items:center;margin-bottom:8px;}
  .tf-row input, .tf-row select{
    width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff;color:var(--ink);
  }
  .tf-row input:focus, .tf-row select:focus{outline:2px solid var(--navy-dim);outline-offset:0;border-color:var(--navy-dim);}
  .tf-row .tf-nominal{font-variant-numeric:tabular-nums;text-align:right;}
  .tf-colhead{display:grid;grid-template-columns:1fr 1.3fr 0.8fr 1fr 1fr 0.8fr auto;gap:6px;
    font-size:11px;color:var(--sub);font-weight:600;margin-bottom:6px;padding:0 2px;}

  .tf-summary-bar{display:flex;justify-content:space-between;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;}
  .tf-summary-bar b{font-variant-numeric:tabular-nums;}

  .tf-check-item{display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;}
  .tf-check-item.checked{border-color:var(--green);background:var(--green-bg);}
  .tf-check-item input[type=checkbox]{width:19px;height:19px;flex-shrink:0;accent-color:var(--green);}
  .tf-ci-main{flex:1;min-width:0;}
  .tf-ci-name{font-weight:700;font-size:14px;}
  .tf-ci-meta{font-size:12px;color:var(--sub);}
  .tf-ci-nominal{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;color:var(--navy);white-space:nowrap;}

  .tf-xfer-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;}
  .tf-xfer-card.done{border-color:var(--green);background:var(--green-bg);}
  .tf-xfer-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .tf-kode{display:inline-block;background:var(--navy);color:#fff;font-weight:700;font-size:13px;
    padding:3px 9px;border-radius:6px;letter-spacing:0.02em;}
  .tf-xfer-nominal{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;color:var(--navy);}
  .tf-xfer-name{font-size:14px;font-weight:600;margin-top:4px;}
  .tf-xfer-bank{font-size:12px;color:var(--sub);}
  .tf-xfer-checks{margin-top:9px;display:flex;flex-direction:column;gap:6px;}
  .tf-xfer-check{display:flex;align-items:center;gap:8px;font-size:13px;}
  .tf-xfer-check input{width:18px;height:18px;accent-color:var(--green);}
  .tf-badge-done{display:inline-block;font-size:11px;font-weight:700;color:var(--green);
    background:#fff;border:1px solid var(--green);border-radius:6px;padding:2px 7px;}

  .tf-progress-wrap{background:var(--line);border-radius:8px;height:7px;overflow:hidden;margin-bottom:12px;}
  .tf-progress-fill{background:var(--navy);height:100%;transition:width .2s;}

  .tf-empty{text-align:center;color:var(--sub);font-size:13px;padding:30px 10px;}
  .tf-actions{display:flex;gap:8px;margin-top:14px;}
  .tf-actions .tf-btn{flex:1;}

  .tf-done-screen{text-align:center;padding:30px 12px;}
  .tf-done-check{width:52px;height:52px;border-radius:50%;background:var(--green-bg);color:var(--green);
    display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:26px;font-weight:700;}
  .tf-hist-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;}
  .tf-hist-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;}
  .tf-hist-sub{font-size:12px;color:var(--sub);margin-top:3px;}
  .tf-status-pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;}
  .tf-status-pill.selesai{background:var(--green-bg);color:var(--green);}
  .tf-status-pill.proses{background:var(--amber-bg);color:var(--amber);}
  .tf-grandtotal{background:var(--navy);color:#fff;border-radius:12px;padding:16px;margin-bottom:14px;}
  .tf-grandtotal .n{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  .tf-grandtotal .l{font-size:12px;opacity:.8;}
  .tf-hist-detail{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;}
  .tf-hist-row{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;}
  .tf-toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:9px 16px;border-radius:20px;font-size:13px;z-index:50;}

  .tf-focus-wrap{padding:6px 0 4px;}
  .tf-focus-pos{text-align:center;font-size:12px;color:var(--sub);font-weight:600;margin-bottom:10px;}
  .tf-focus-card{background:var(--panel);border:2px solid var(--navy);border-radius:16px;
    padding:26px 20px;text-align:center;margin-bottom:14px;}
  .tf-focus-kode{display:inline-block;background:var(--amber-bg);color:var(--amber);font-weight:700;
    font-size:12px;padding:3px 10px;border-radius:20px;margin-bottom:10px;}
  .tf-focus-name{font-size:32px;font-weight:800;color:var(--green);line-height:1.25;font-variant-numeric:tabular-nums;}
  .tf-focus-nominal{font-size:32px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;
    margin:8px 0 4px;}
  .tf-focus-meta{font-size:12.5px;color:var(--sub);}
  .tf-focus-btns{display:flex;gap:8px;margin-top:18px;}
  .tf-focus-btns .tf-btn{flex:1;padding:12px;font-size:14px;}
  .tf-focus-nav{display:flex;justify-content:space-between;margin-top:10px;}
  .tf-focus-edit{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;text-align:left;}
  .tf-focus-edit label{display:block;font-size:11px;color:var(--sub);font-weight:600;margin:8px 0 3px;}
  .tf-focus-edit input,.tf-focus-edit select{width:100%;padding:9px 10px;border:1px solid var(--line);
    border-radius:8px;font-size:14px;}
  .tf-done-card{background:var(--green-bg);border:1px solid var(--green);border-radius:14px;
    padding:24px;text-align:center;margin-bottom:14px;}

  .tf-tick-row{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:13px;
    font-weight:700;color:var(--green);}
  .tf-xfer-hist{margin-top:16px;display:flex;flex-direction:column;gap:5px;}
  .tf-xfer-hist-item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;}
  .tf-xfer-hist-item.current{border-color:var(--navy);border-width:2px;font-weight:700;}
  .tf-xfer-hist-item.done{background:#FCEBD5;border-color:#F0C793;}
  .tf-xfer-hist-kode{font-weight:700;color:var(--navy);}
  .tf-xfer-hist-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tf-xfer-hist-nominal{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;}
  .tf-xfer-hist-item.done .tf-xfer-hist-nominal{background:#FBDCB0;padding:1px 6px;border-radius:5px;}

  .tf-excel-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;-webkit-overflow-scrolling:touch;}
  table.tf-excel{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;}
  table.tf-excel th, table.tf-excel td{border:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap;}
  table.tf-excel th{background:#EFEDE6;color:var(--sub);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.02em;}
  table.tf-excel td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
  table.tf-excel td.chk{text-align:center;}
  table.tf-excel input[type=checkbox]{width:17px;height:17px;accent-color:var(--green);}
  table.tf-excel tbody tr:nth-child(even){background:#FAFAF7;}
  table.tf-excel td.tf-cell-name-checked{background:#FBDCB0;font-weight:700;}

  input[type=date]{padding:6px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;background:#fff;color:var(--ink);}

  .tf-modal-overlay{position:fixed;inset:0;background:rgba(20,22,26,0.55);display:flex;
    align-items:center;justify-content:center;z-index:100;padding:16px;}
  .tf-modal{background:#fff;border-radius:14px;padding:20px;max-width:360px;width:100%;}
  .tf-modal h3{margin:0 0 6px;font-size:16px;}
  .tf-modal p{margin:0 0 10px;font-size:13px;color:var(--sub);line-height:1.5;}
  .tf-modal code{display:block;background:var(--red-bg);color:var(--red);font-weight:700;
    padding:8px 10px;border-radius:8px;font-size:13px;margin:8px 0 12px;text-align:center;}
  .tf-modal input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:14px;}
  .tf-modal label{display:block;font-size:11px;color:var(--sub);font-weight:600;margin:8px 0 3px;}
  .tf-modal select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:14px;}

  .tf-row-actions{display:flex;gap:2px;justify-content:center;}
  .tf-icon-btn{border:none;background:transparent;color:#000;cursor:pointer;padding:4px 6px;
    border-radius:6px;display:inline-flex;align-items:center;justify-content:center;}
  .tf-icon-btn:hover{background:var(--line);}
  .tf-icon-btn.edit{color:var(--navy);}

  td.tf-jam-empty{color:var(--red);background:var(--red-bg);font-weight:700;}

  .tf-notes-wrap{margin-top:4px;}
  .tf-notes-label{display:block;font-size:12px;color:var(--sub);font-weight:600;margin-bottom:6px;}
  .tf-notes-wrap textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
    font-size:13px;font-family:inherit;resize:vertical;background:#fff;color:var(--ink);}
  .tf-notes-wrap textarea:focus{outline:2px solid var(--navy-dim);outline-offset:0;border-color:var(--navy-dim);}

  .tf-datebar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;}
  .tf-datebar-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .tf-datebar-row input[type=date]{flex:1;min-width:130px;}
  .tf-datebar-label{margin-top:8px;font-size:14px;font-weight:700;color:var(--navy);}
  .tf-datebar-label.readonly{margin-top:0;}
  .tf-date-warn{color:var(--amber);font-weight:600;font-size:12px;}

  .tf-inline-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .tf-inline-hint{font-size:12px;color:var(--sub);line-height:1.4;}
  .tf-inline-bar .tf-btn{white-space:nowrap;flex:none;}
  table.tf-excel td.tf-td-ie{padding:3px 4px;}
  .tf-ie{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:#fff;color:var(--ink);font-family:inherit;}
  .tf-ie:focus{outline:2px solid var(--navy-dim);outline-offset:0;border-color:var(--navy-dim);}
  .tf-ie[data-ie="kode"]{min-width:58px;}
  .tf-ie[data-ie="nama"]{min-width:140px;}
  .tf-ie[data-ie="bank"]{min-width:84px;}
  .tf-ie[data-ie="nominal"]{min-width:104px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;}
  .tf-ie[data-ie="pelanggan"]{min-width:120px;}
  .tf-ie[data-ie="jam"]{min-width:66px;}
</style>
</head>

<!-- Firebase SDK (versi "compat" supaya bisa langsung pakai tag script tanpa bundler) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
// ============================================================
// KONFIGURASI FIREBASE — WAJIB DIISI SEBELUM DIPAKAI.
// Cara mendapatkannya:
// 1. Buka console.firebase.google.com, buka proyek kamu.
// 2. Klik ikon gerigi (Project settings) di pojok kiri atas.
// 3. Scroll ke bagian "Your apps". Kalau belum ada app web,
//    klik ikon </> untuk menambahkan satu (beri nama bebas, tidak perlu Hosting).
// 4. Salin objek firebaseConfig yang muncul, tempel menggantikan yang di bawah ini.
// ============================================================
const firebaseConfig = {

  apiKey: "AIzaSyAuIT39ETdmFaMpRRGlfE163n_8qLPb8Fc",

  authDomain: "transfer-dba8c.firebaseapp.com",

  projectId: "transfer-dba8c",

  storageBucket: "transfer-dba8c.firebasestorage.app",

  messagingSenderId: "1046293296625",

  appId: "1:1046293296625:web:f99d31b11665b3b5d2c050"

};


firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const FS_COLLECTION = 'riderTransferData'; // nama koleksi di Firestore

let currentUser = null;

// Ganti window.storage supaya baca/tulis ke Firestore (bukan localStorage lagi).
// Setiap pengguna login punya dokumen sendiri (dikunci pakai uid-nya),
// jadi datanya terpisah dan tidak bisa diakses akun lain (lihat security rules).
window.storage = {
  async get(key){
    if(!currentUser) return null;
    const snap = await db.collection(FS_COLLECTION).doc(currentUser.uid).get();
    if(!snap.exists) return null;
    const data = snap.data();
    if(data[key] === undefined || data[key] === null) return null;
    return { key, value: data[key], shared: false };
  },
  // Ambil seluruh dokumen sekaligus (1x read Firestore), dipakai saat load awal & refresh manual
  // supaya tidak perlu 2 kali read terpisah untuk data sesi + catatan.
  async getAll(){
    if(!currentUser) return {};
    const snap = await db.collection(FS_COLLECTION).doc(currentUser.uid).get();
    return snap.exists ? snap.data() : {};
  },
  async set(key, value){
    if(!currentUser) return null;
    await db.collection(FS_COLLECTION).doc(currentUser.uid).set({ [key]: value }, { merge: true });
    return { key, value, shared: false };
  },
  async delete(key){
    if(!currentUser) return null;
    await db.collection(FS_COLLECTION).doc(currentUser.uid)
      .update({ [key]: firebase.firestore.FieldValue.delete() });
    return { key, deleted: true, shared: false };
  },
  async list(prefix){
    if(!currentUser) return { keys: [], prefix, shared: false };
    const snap = await db.collection(FS_COLLECTION).doc(currentUser.uid).get();
    const data = snap.exists ? snap.data() : {};
    const keys = Object.keys(data).filter(k => !prefix || k.startsWith(prefix));
    return { keys, prefix, shared: false };
  }
};

// ---------- Layar login ----------
function tfEsc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderLoginScreen(errorMsg){
  const root = document.getElementById('tf-root');
  root.innerHTML = `
    <div class="tf-h1">Transfer Rider</div>
    <div class="tf-sub">Masuk dulu untuk mengakses data kamu.</div>
    <div class="tf-card" style="max-width:360px;margin:20px auto;">
      <label style="display:block;font-size:11px;color:var(--sub);font-weight:600;margin-bottom:4px;">Email</label>
      <input id="tf-login-email" type="email" autocomplete="username"
        style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:10px;"
        placeholder="nama@email.com">
      <label style="display:block;font-size:11px;color:var(--sub);font-weight:600;margin-bottom:4px;">Password</label>
      <input id="tf-login-pass" type="password" autocomplete="current-password"
        style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:10px;"
        placeholder="••••••••">
      ${errorMsg ? `<div style="color:var(--red);font-size:12.5px;margin-bottom:10px;">${tfEsc(errorMsg)}</div>` : ''}
      <button id="tf-login-btn" class="tf-btn primary" style="width:100%;">Masuk</button>
    </div>
  `;
  document.getElementById('tf-login-btn').addEventListener('click', tfDoLogin);
  document.getElementById('tf-login-pass').addEventListener('keydown', function(e){ if(e.key==='Enter') tfDoLogin(); });
}
function tfDoLogin(){
  const email = document.getElementById('tf-login-email').value.trim();
  const pass = document.getElementById('tf-login-pass').value;
  const btn = document.getElementById('tf-login-btn');
  btn.disabled = true; btn.textContent = 'Memproses…';
  auth.signInWithEmailAndPassword(email, pass)
    .catch(function(err){
      renderLoginScreen('Login gagal: email atau password salah.');
    });
}
window.tfLogout = function(){
  auth.signOut();
};

auth.onAuthStateChanged(function(user){
  if(user){
    currentUser = user;
    if(window.__tfReset) window.__tfReset();
    if(window.__tfBoot) window.__tfBoot();
  } else {
    currentUser = null;
    renderLoginScreen();
  }
});
</script>

<script>
(function(){
  const STORAGE_KEY = 'rider-transfer-sessions-v1';
  let sessions = [];
  let currentSessionId = null;
  let view = 'session'; // 'session' | 'riwayat'
  let expandedHistId = null;
  let ready = false;
  let pendingFocus = null; // {rowIndex, col}
  let editingEntryId = null;
  let editDraft = null;
  let riwayatDate = todayKey();   // tanggal filter halaman Riwayat & Cetak ('' = semua tanggal)
  let berandaDate = todayKey();   // tanggal yang sedang dibuka di halaman Beranda
  let entryDeleteConfirm = null; // {sid, eid, nama, nominal}
  let riwayatEdit = null; // {sid, eid, draft:{kode,nama,bank,nominal,pelanggan,jam}}
  let riwayatNotes = '';
  let riwayatInline = false;   // true = sel tabel Riwayat bisa diedit langsung
  const BANK_LIST = ['BCA','BRI','BNI','Mandiri','DANA','OVO','Lainnya'];
  const NOTES_KEY = 'rider-transfer-notes-v1';

  function uid(){ return Math.random().toString(36).slice(2,10); }
  // Mencegah XSS: escape karakter HTML berbahaya sebelum dimasukkan ke innerHTML/atribut.
  // Semua teks yang berasal dari input pengguna (nama, pelanggan, catatan, dll) HARUS lewat sini
  // sebelum dirender, supaya tidak bisa menyisipkan tag <script> atau atribut event (onerror, dsb).
  function esc(val, fallback){
    if(val===undefined || val===null || val===''){ return fallback!==undefined ? fallback : ''; }
    return String(val).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function nowLabel(){
    const d = new Date();
    return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'}) + ' ' + d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  }
  function todayFullLabel(){
    const d = new Date();
    return d.toLocaleDateString('id-ID',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  }
  function rupiah(n){
    n = Number(n)||0;
    return 'Rp' + n.toLocaleString('id-ID');
  }
  function emptyEntry(){
    return {id:uid(), kode:'', nama:'', bank:'BCA', nominal:'', pelanggan:'', jam:'', cekAwal:false, cekPre:false, transferred:false, cekPin:false, cekFinal:false, xferStage:0};
  }
  // ---------- helper tanggal ----------
  function todayKey(){ return dateKey(Date.now()); }
  // Validasi format YYYY-MM-DD sebelum dipakai (nilai <input type=date> tetap diperlakukan sebagai input tak tepercaya).
  function isValidDateKey(v){
    return typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(new Date(v+'T00:00:00').getTime());
  }
  function shiftDateKey(k, delta){
    const d = new Date(k+'T00:00:00');
    d.setDate(d.getDate()+delta);
    return dateKey(d.getTime());
  }
  // Timestamp pada tanggal k dengan jam sekarang (supaya sesi tercatat di tanggal yang dipilih).
  function tsForDate(k){
    const p = k.split('-').map(Number), n = new Date();
    return new Date(p[0], p[1]-1, p[2], n.getHours(), n.getMinutes(), n.getSeconds()).getTime();
  }
  function sessionsOn(k){ return sessions.filter(s=>dateKey(s.createdAt)===k); }
  // Sesi yang dibuka untuk tanggal k: utamakan yang belum selesai, kalau tidak ada ambil yang terakhir.
  function pickSessionFor(k){
    const list = sessionsOn(k);
    return list.find(s=>s.step!==5) || list[list.length-1] || null;
  }

  function newSession(dateK){
    const k = isValidDateKey(dateK) ? dateK : (isValidDateKey(berandaDate) ? berandaDate : todayKey());
    const s = { id: uid(), label: 'Sesi ' + (sessionsOn(k).length+1), createdAt: tsForDate(k), finishedAt:null, step:1, entries:[emptyEntry()], admin:'', adminCustom:'', adminCustomDraft:'' };
    sessions.push(s);
    currentSessionId = s.id;
    berandaDate = k;
    view = 'session';
  }
  function setBerandaDate(k){
    if(!isValidDateKey(k)) return;
    berandaDate = k;
    const p = pickSessionFor(k);
    currentSessionId = p ? p.id : null;
    editingEntryId = null; editDraft = null;
    view = 'session';
    render();
  }
  function sessionAdminLabel(s){
    if(!s) return '';
    return s.admin==='Lainnya' ? (s.adminCustom||'').trim() : (s.admin||'');
  }
  function sessionDisplayLabel(s){
    if(!s) return '';
    const admin = sessionAdminLabel(s);
    return admin ? `${s.label} (${admin})` : s.label;
  }
  function getCurrent(){ return sessions.find(s=>s.id===currentSessionId); }

  async function load(){
    try{
      const data = await window.storage.getAll();
      sessions = data[STORAGE_KEY] ? JSON.parse(data[STORAGE_KEY]) : [];
      riwayatNotes = data[NOTES_KEY] || '';
    }catch(e){ sessions = []; riwayatNotes = ''; }
    berandaDate = todayKey();
    riwayatDate = berandaDate;
    const todays = sessionsOn(berandaDate);
    const active = todays.find(s=>s.step!==5);
    if(active){ currentSessionId = active.id; }
    else if(todays.length===0){ newSession(berandaDate); }
    else { currentSessionId = todays[todays.length-1].id; view='riwayat'; }
    ready = true;
    render();
  }
  async function save(){
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(sessions), false); }
    catch(e){ console.error('gagal menyimpan', e); }
  }
  let isRefreshing = false;
  async function refreshData(){
    if(isRefreshing) return;
    isRefreshing = true;
    render();
    try{
      const data = await window.storage.getAll();
      sessions = data[STORAGE_KEY] ? JSON.parse(data[STORAGE_KEY]) : [];
      riwayatNotes = data[NOTES_KEY] || '';
      if(!sessions.find(s=>s.id===currentSessionId)){
        const p = pickSessionFor(berandaDate);
        currentSessionId = p ? p.id : null;
      }
      toast('Data terbaru dimuat');
    }catch(e){
      toast('Gagal memuat data terbaru');
    }
    isRefreshing = false;
    render();
  }
  async function saveNotes(){
    try{ await window.storage.set(NOTES_KEY, riwayatNotes, false); }
    catch(e){ console.error('gagal menyimpan catatan', e); }
  }

  function toast(msg){
    const t = document.createElement('div');
    t.className = 'tf-toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 1600);
  }

  // ---------- render pieces ----------
  function stepsBar(step){
    const labels = ['Input','Cek Awal','Transfer','Cek Akhir'];
    return `<div class="tf-steps">` + labels.map((l,i)=>{
      const n=i+1;
      const cls = n<step ? 'done' : (n===step ? 'active' : '');
      return `<div class="tf-step ${cls}">${n}. ${l}</div>`;
    }).join('') + `</div>`;
  }

  function lastCompleteEntry(){
    for(let i=sessions.length-1;i>=0;i--){
      const s = sessions[i];
      for(let j=s.entries.length-1;j>=0;j--){
        const e = s.entries[j];
        if(e.kode.trim() && e.nama.trim() && Number(e.nominal)>0) return e;
      }
    }
    return null;
  }

  function topbar(s){
    const last = lastCompleteEntry();
    const preview = last ? `${esc(last.kode,'-')} · ${esc(last.nama,'-')} · ${rupiah(last.nominal)}${last.pelanggan?` · ${esc(last.pelanggan)}`:''}` : esc(sessionDisplayLabel(s));
    const adminLabel = sessionAdminLabel(s);
    return `
      <div class="tf-topbar">
        <div>
          <div class="tf-session-label">${preview}</div>
          ${adminLabel ? `<div style="font-size:11px;color:var(--sub);margin-top:2px;">Admin: ${esc(adminLabel)}</div>` : ''}
        </div>
        <div style="display:flex;gap:6px;">
          <button class="tf-btn small" data-act="refresh-data" title="Muat ulang data" ${isRefreshing?'disabled':''}>${isRefreshing?'⏳':'🔄'}</button>
          <button class="tf-btn small" data-act="riwayat">Riwayat</button>
          <button class="tf-btn small" data-act="new-session">+ Sesi baru</button>
          <button class="tf-btn small" data-act="logout" title="Keluar">⎋</button>
        </div>
      </div>`;
  }

  // Tanggal selain hari ini: tanpa ringkasan transaksi terakhir dan tanpa tombol "+ Sesi baru".
  function topbarPast(){
    return `
      <div class="tf-topbar" style="justify-content:flex-end;">
        <div style="display:flex;gap:6px;">
          <button class="tf-btn small" data-act="refresh-data" title="Muat ulang data" ${isRefreshing?'disabled':''}>${isRefreshing?'⏳':'🔄'}</button>
          <button class="tf-btn small" data-act="riwayat">Riwayat</button>
          <button class="tf-btn small" data-act="logout" title="Keluar">⎋</button>
        </div>
      </div>`;
  }

  function formatJam(raw){
    return raw;
  }

  function formatKode(raw){
    return raw;
  }

  // Patokan kode -> nama rider, dipakai untuk auto-isi kolom Nama saat kode diketik.
  const RIDER_MAP = {
    'A01':'AGUS SETIONO','A02':'UMAR ARIFUDIN','A03':'RESTU REVA','A04':'Aris januarianto',
    'A05':'ARIF TRIYONO','A06':'MUFTI HIDAYAT','A07':'UMAR SAHID','A08':'IWAN SETIAWAN',
    'A09':'OPY HERMAWAN','A10':'DEDI TRI KURNIAWAN','A11':'ARI SETIAWAN','A12':'ROY SAHALAL P.S',
    'A13':'WARIHATNO','A14':'WELLY YULIANTO','A15':'AHMAD BUDIANTO','A17':'SEPKA ROMADI',
    'A18':'KUWATMAN','A19':'Andika Yanuar Ramadhanu','A20':'LAIMIN','A21':'DENY SETIAWAN',
    'A22':'RAHMAT DARMAWAN','A24':'NANDA RYAN WIDODO','A25':'ADE DWI PERMADI','A26':'SEPTYAN SYAHPUTRA H',
    'A27':'DEMI WASPODO','A28':'PRASETYO','A29':'TEGUH PRASETYO','A31':'dede al syukur',
    'A32':'PARYANTO','A33':'TEGUH B','A34':'LUKMAN','A35':'EKO FATHULLOH',
    'A36':'Choirul rachman','A37':'Irvan Rosadi','PT1':'IMAM ARIFIN','PT2':'ANDHITA YOGA P','PT3':'GUNAWAN WIBISONO'
  };
  function lookupRiderName(kode){
    if(!kode) return '';
    return RIDER_MAP[kode.trim().toUpperCase()] || '';
  }

  function formatNominalDisplay(digitsOnly){
    if(!digitsOnly) return '';
    return 'Rp' + Number(digitsOnly).toLocaleString('id-ID');
  }

  function isRowComplete(e){
    if(!e) return false;
    return !!(e.kode.trim() && e.nama.trim() && Number(e.nominal)>0);
  }

  function renderStep1(s){
    const adminLabel = sessionAdminLabel(s);
    const adminSet = !!adminLabel;
    const rows = s.entries.map((e,i)=>`
      <div class="tf-row" data-eid="${e.id}" data-row-index="${i}">
        <input placeholder="Kode" data-field="kode" data-col="0" value="${esc(e.kode)}" ${adminSet?'':'disabled'}>
        <input placeholder="Nama rider" data-field="nama" data-col="1" value="${esc(e.nama)}" ${adminSet?'':'disabled'}>
        <select data-field="bank" data-col="2" ${adminSet?'':'disabled'}>
          ${['BCA','BRI','BNI','Mandiri','DANA','OVO','Lainnya'].map(b=>`<option ${e.bank===b?'selected':''}>${b}</option>`).join('')}
        </select>
        <input class="tf-nominal" placeholder="Rp0" inputmode="numeric" data-field="nominal" data-col="3" value="${formatNominalDisplay(e.nominal)}" ${adminSet?'':'disabled'}>
        <input placeholder="Pelanggan" data-field="pelanggan" data-col="4" value="${esc(e.pelanggan)}" ${adminSet?'':'disabled'}>
        <input placeholder="Jam" data-field="jam" data-col="5" value="${esc(e.jam)}" ${adminSet?'':'disabled'}>
        <button class="tf-btn ghost" data-act="del-row" data-eid="${e.id}" title="Hapus" tabindex="-1" ${adminSet?'':'disabled'}>✕</button>
      </div>`).join('');
    const total = s.entries.reduce((a,e)=>a+(Number(e.nominal)||0),0);
    const isEmptyRow = (e)=> !e.kode.trim() && !e.nama.trim() && !e.nominal;
    const filled = s.entries.filter(e=>!isEmptyRow(e));
    const valid = adminSet && filled.length>0 && filled.every(e=>e.nama.trim() && Number(e.nominal)>0);
    const lastComplete = adminSet && isRowComplete(s.entries[s.entries.length-1]);
    const adminOptions = ['Alifah','Rohmah','Rasiti','Si e O','Lainnya'];
    const customConfirmed = s.admin==='Lainnya' && !!(s.adminCustom||'').trim();
    const draftVal = s.adminCustomDraft!==undefined && s.adminCustomDraft!==null ? s.adminCustomDraft : (s.adminCustom||'');
    const adminBlock = `
      <div class="tf-card" style="margin-bottom:10px;">
        <label style="display:block;font-size:11px;color:var(--sub);font-weight:600;margin-bottom:4px;">Admin penginputan sesi ini</label>
        <select data-field="session-admin">
          <option value="" ${!s.admin?'selected':''}>Pilih admin...</option>
          ${adminOptions.map(a=>`<option value="${a}" ${s.admin===a?'selected':''}>${a}</option>`).join('')}
        </select>
        ${s.admin==='Lainnya' ? `
        <div style="display:flex;gap:6px;margin-top:8px;">
          <input placeholder="Tulis nama admin" data-field="session-admin-custom" value="${esc(draftVal)}" style="flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;">
          <button class="tf-btn primary" data-act="confirm-admin-custom" style="padding:9px 14px;">OK</button>
        </div>
        ${customConfirmed ? `<div style="font-size:12px;color:var(--green);margin-top:6px;">✓ Masuk sebagai ${esc((s.adminCustom||'').trim())}</div>` : '<div style="font-size:12px;color:var(--sub);margin-top:6px;">Tulis nama lalu tekan OK untuk masuk.</div>'}
        ` : ''}
        ${adminSet ? '' : '<div style="font-size:12px;color:var(--red);margin-top:8px;">⚠ Pilih admin penginputan dulu sebelum bisa mengisi data rider.</div>'}
      </div>`;
    return `
      ${adminBlock}
      <div class="tf-card" style="${adminSet?'':'opacity:.5;'}">
        <div class="tf-colhead"><span>Kode</span><span>Nama</span><span>Bank</span><span>Nominal</span><span>Pelanggan</span><span>Jam</span><span></span></div>
        ${rows}
        <button class="tf-btn" data-act="add-row" style="width:100%;margin-top:4px;" ${lastComplete?'':'disabled'}>+ Tambah rider</button>
      </div>
      ${!adminSet? '' : (lastComplete? '' : '<div class="tf-empty" style="padding:6px 4px;">Isi kode, nama, dan nominal baris terakhir dulu (atau tekan Enter) untuk menambah rider.</div>')}
      <div class="tf-summary-bar"><span>${filled.length} rider</span><b>${rupiah(total)}</b></div>
      <div class="tf-actions">
        <button class="tf-btn primary" data-act="to-step2" ${valid?'':'disabled'}>Lanjut: Cek awal (bawah → atas)</button>
      </div>
      ${valid? '' : '<div class="tf-empty">Isi nama dan nominal setiap baris yang terisi untuk lanjut (baris kosong di akhir boleh dibiarkan).</div>'}
    `;
  }

  function checkStep(s, field, title, nextLabel, nextAct, backAct){
    const reversed = [...s.entries].reverse();
    const items = reversed.map(e=>`
      <label class="tf-check-item ${e[field]?'checked':''}">
        <input type="checkbox" data-eid="${e.id}" data-field="${field}" ${e[field]?'checked':''}>
        <div class="tf-ci-main">
          <div class="tf-ci-name">${esc(e.nama,'(tanpa nama)')}</div>
          <div class="tf-ci-meta">Kode ${e.kode||'-'} · ${e.bank}</div>
        </div>
        <div class="tf-ci-nominal">${rupiah(e.nominal)}</div>
      </label>`).join('');
    const done = s.entries.filter(e=>e[field]).length;
    const allDone = done===s.entries.length && s.entries.length>0;
    return `
      <div class="tf-summary-bar"><span>${title}</span><b>${done}/${s.entries.length} dicek</b></div>
      <div class="tf-progress-wrap"><div class="tf-progress-fill" style="width:${s.entries.length? (done/s.entries.length*100):0}%"></div></div>
      ${items}
      <div class="tf-actions">
        <button class="tf-btn" data-act="${backAct}">Kembali</button>
        <button class="tf-btn primary" data-act="${nextAct}" ${allDone?'':'disabled'}>${nextLabel}</button>
      </div>
    `;
  }

  function renderStep2(s){
    const order = [...s.entries].reverse(); // bottom -> top
    const total = order.length;
    let idx = s.reviewIndex||0;
    if(idx>total) idx=total;
    const doneCount = order.filter(e=>e.cekAwal).length;

    if(idx>=total){
      return `
        <div class="tf-done-card">
          <div class="tf-done-check" style="margin:0 auto 12px;">✓</div>
          <div style="font-size:16px;font-weight:700;">Semua sudah dicek</div>
          <div style="color:var(--sub);font-size:13px;margin-top:4px;">${doneCount}/${total} nama &amp; nominal sudah dicocokkan</div>
        </div>
        <div class="tf-actions">
          <button class="tf-btn" data-act="review-restart">Cek ulang</button>
          <button class="tf-btn" data-act="to-step1">Edit data</button>
          <button class="tf-btn primary" data-act="to-step3">Lanjut: Eksekusi transfer</button>
        </div>
      `;
    }

    const e = order[idx];
    const isEditing = editingEntryId===e.id;
    const draft = isEditing ? editDraft : null;

    let editBlock = '';
    if(isEditing){
      editBlock = `
        <div class="tf-focus-edit">
          <label>Kode rider</label>
          <input data-draft="kode" value="${esc(draft.kode)}">
          <label>Nama rider</label>
          <input data-draft="nama" value="${esc(draft.nama)}">
          <label>Bank</label>
          <select data-draft="bank">
            ${['BCA','BRI','BNI','Mandiri','DANA','OVO','Lainnya'].map(b=>`<option ${draft.bank===b?'selected':''}>${b}</option>`).join('')}
          </select>
          <label>Nominal</label>
          <input data-draft="nominal" inputmode="numeric" value="${formatNominalDisplay(draft.nominal)}">
          <div class="tf-actions" style="margin-top:12px;">
            <button class="tf-btn" data-act="edit-cancel">Batal</button>
            <button class="tf-btn primary" data-act="edit-save" data-eid="${e.id}">Simpan</button>
          </div>
        </div>`;
    }

    return `
      <div class="tf-focus-wrap">
        <div class="tf-focus-pos">Mengecek ${idx+1} dari ${total} · urutan bawah → atas</div>
        <div class="tf-progress-wrap"><div class="tf-progress-fill" style="width:${(idx/total*100)}%"></div></div>
        <div class="tf-focus-card">
          <span class="tf-focus-kode">Kode ${e.kode||'-'} · ${e.bank}</span>
          <div class="tf-focus-name">${esc(e.nama,'(tanpa nama)')}</div>
          <div class="tf-focus-nominal">${rupiah(e.nominal)}</div>
          <div class="tf-focus-meta">Jam ${e.jam||'-'}</div>
          ${isEditing ? editBlock : `
          <div class="tf-focus-btns">
            <button class="tf-btn" data-act="focus-edit" data-eid="${e.id}">✎ Edit</button>
            <button class="tf-btn primary" data-act="focus-confirm" data-eid="${e.id}">✓ Sudah benar, lanjut</button>
          </div>
          <button class="tf-btn small" data-act="add-row-below" data-eid="${e.id}" style="width:100%;margin-top:8px;">+ Tambahkan baris baru di bawah rider ini</button>`}
        </div>
        ${isEditing ? '' : `
        <div class="tf-focus-nav">
          <button class="tf-btn small" data-act="focus-prev" ${idx===0?'disabled':''}>◀ Sebelumnya</button>
          <button class="tf-btn small" data-act="to-step1">Lihat semua data</button>
        </div>`}
      </div>
    `;
  }

  function renderStep3(s){
    const total = s.entries.length;
    let idx = s.xferIndex;
    if(idx===undefined || idx===null){ idx = s.entries.findIndex(e=>!e.transferred); if(idx<0) idx=total; }
    const doneCount = s.entries.filter(e=>e.transferred).length;

    const historyList = `
      <div class="tf-xfer-hist">
        ${s.entries.map((e,i)=>{
          const cls = e.transferred ? 'done' : (i===idx ? 'current' : '');
          return `<div class="tf-xfer-hist-item ${cls}">
            <span class="tf-xfer-hist-kode">${e.kode||'#'+(i+1)}</span>
            <span class="tf-xfer-hist-name">${esc(e.nama,'(tanpa nama)')}</span>
            <span class="tf-xfer-hist-nominal">${rupiah(e.nominal)}</span>
          </div>`;
        }).join('')}
      </div>`;

    if(idx>=total){
      return `
        <div class="tf-done-card">
          <div class="tf-done-check" style="margin:0 auto 12px;">✓</div>
          <div style="font-size:16px;font-weight:700;">Semua rider sudah ditransfer</div>
          <div style="color:var(--sub);font-size:13px;margin-top:4px;">${doneCount}/${total} transferan selesai</div>
          <div style="color:var(--sub);font-size:12px;margin-top:6px;">${esc(formatFullDateID(dateKey(s.createdAt)))}</div>
        </div>
        ${historyList}
        <div class="tf-actions">
          <button class="tf-btn" data-act="to-step2">Kembali</button>
          <button class="tf-btn primary" data-act="to-step4">Lanjut: Cek akhir</button>
        </div>
      `;
    }

    const e = s.entries[idx];
    const stage = e.xferStage||0;

    let card;
    if(stage===0){
      card = `
        <div class="tf-focus-card">
          <span class="tf-focus-kode">Rider ${idx+1} dari ${total} · ${e.bank}</span>
          <div class="tf-focus-name">${e.kode||'-'}</div>
          <div class="tf-focus-nominal">${rupiah(e.nominal)}</div>
          <div class="tf-focus-meta" style="margin-top:8px;">Silakan masukkan <b>kode</b> dan <b>nominal</b> pada menu transfer di ${e.bank}.</div>
          <div class="tf-focus-btns">
            <button class="tf-btn primary" data-act="xfer-enter" data-eid="${e.id}">Enter ⏎</button>
          </div>
        </div>`;
    } else if(stage===1){
      card = `
        <div class="tf-focus-card">
          <span class="tf-focus-kode">Rider ${idx+1} dari ${total} · kode ${e.kode||'-'}</span>
          <div class="tf-focus-name">${esc(e.nama,'(tanpa nama)')}</div>
          <div class="tf-focus-nominal">${rupiah(e.nominal)}</div>
          <div class="tf-focus-meta" style="margin-top:8px;">Cek apakah nama rider dan nominal sudah sama.<br><b>JIKA SESUAI</b>, silakan masukkan PIN di ${e.bank}.</div>
          <div class="tf-focus-btns">
            <button class="tf-btn primary" data-act="xfer-enter" data-eid="${e.id}">Enter ⏎</button>
          </div>
        </div>`;
    } else {
      card = `
        <div class="tf-focus-card">
          <span class="tf-focus-kode">Rider ${idx+1} dari ${total} · kode ${e.kode||'-'}</span>
          <div class="tf-focus-name">${esc(e.nama,'(tanpa nama)')}</div>
          <div class="tf-focus-nominal">${rupiah(e.nominal)}</div>
          <div class="tf-tick-row">
            <span>✓ Nama cocok</span><span>✓ Nominal cocok</span>
          </div>
          <div class="tf-focus-btns">
            <button class="tf-btn primary" data-act="xfer-next" data-eid="${e.id}">Lanjut ke rider berikutnya →</button>
          </div>
        </div>`;
    }

    return `
      <div class="tf-focus-wrap">
        <div class="tf-focus-pos" style="margin-bottom:2px;">${esc(formatFullDateID(dateKey(s.createdAt)))}</div>
        <div class="tf-focus-pos">Eksekusi transfer ${idx+1} dari ${total} · urutan atas → bawah</div>
        <div class="tf-progress-wrap"><div class="tf-progress-fill" style="width:${(doneCount/total*100)}%"></div></div>
        ${card}
        <div class="tf-focus-nav">
          <button class="tf-btn small" data-act="xfer-prev" ${idx===0?'disabled':''}>◀ Rider sebelumnya</button>
          <button class="tf-btn small" data-act="to-step2">Kembali ke Cek Awal</button>
        </div>
        ${historyList}
      </div>
    `;
  }

  function dateKey(ts){
    const d = new Date(ts);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function renderExcelTable(entries, checkField, editable){
    const rows = entries.map((e,i)=>`
      <tr>
        <td>${i+1}</td>
        <td>${e.kode||'-'}</td>
        <td class="${e[checkField]?'tf-cell-name-checked':''}">${esc(e.nama,'-')}</td>
        <td>${e.bank}</td>
        <td class="num">${rupiah(e.nominal)}</td>
        <td>${esc(e.pelanggan,'-')}</td>

  function renderStep4(s){
    const order = [...s.entries].reverse(); // bottom -> top

  function renderDone(s){
    const total = s.entries.reduce((a,e)=>a+(Number(e.nominal)||0),0);
    return `
      <div class="tf-done-screen">

          <button class="tf-btn primary" data-act="new-session">Mulai sesi baru</button>
        </div>

  }

  const trashSvg = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 7H20" stroke="#000" stroke-width="2" stroke-linecap="round"/>

    <path d="M6 7L6.75 19.25C6.79 19.95 7.37 20.5 8.07 20.5H15.93C16.63 20.5 17.21 19.95 17.25 19.25L18 7" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M16.5 3.5C17.0304 2.96957 17.7496 2.6716 18.5 2.6716C19.2504 2.6716 19.9696 2.96957 20.5 3.5C21.0304 4.03043 21.3284 4.74957 21.3284 5.5C21.3284 6.25043 21.0304 6.96957 20.5 7.5L7 21L3 22L4 18L17.5 4.5L16.5 3.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;

  function renderCombinedExcelTable(rows, showDate, inline){
    const trs = rows.map((r,i)=>{
      const sid = esc(r.sesiId), eid = esc(r.id);
      const ie = (field, val, attrs)=>`<input class="tf-ie" data-ie="${field}" data-sid="${sid}" data-eid="${eid}" value="${esc(val)}" ${attrs||''}>`;
      const kode = inline ? `<td class="tf-td-ie">${ie('kode', r.kode, 'maxlength="8" autocomplete="off"')}</td>` : `<td>${esc(r.kode,'-')}</td>`;
      const nama = inline ? `<td class="tf-td-ie ${r.cekFinal?'tf-cell-name-checked':''}">${ie('nama', r.nama, 'maxlength="40" autocomplete="off"')}</td>`
                          : `<td class="${r.cekFinal?'tf-cell-name-checked':''}">${esc(r.nama,'-')}</td>`;
      const bank = inline ? `<td class="tf-td-ie"><select class="tf-ie" data-ie="bank" data-sid="${sid}" data-eid="${eid}">${BANK_LIST.map(b=>`<option ${r.bank===b?'selected':''}>${b}</option>`).join('')}</select></td>` : `<td>${esc(r.bank)}</td>`;
      const nominal = inline ? `<td class="tf-td-ie num">${ie('nominal', formatNominalDisplay(r.nominal), 'inputmode="numeric" autocomplete="off"')}</td>` : `<td class="num">${rupiah(r.nominal)}</td>`;
      const pelanggan = inline ? `<td class="tf-td-ie">${ie('pelanggan', r.pelanggan||'', 'maxlength="30" autocomplete="off"')}</td>` : `<td>${esc(r.pelanggan,'-')}</td>`;
      const jam = inline ? `<td class="tf-td-ie ${r.jam?'':'tf-jam-empty'}">${ie('jam', r.jam||'', 'maxlength="12" autocomplete="off" placeholder="jj:mm"')}</td>` : `<td class="${r.jam?'':'tf-jam-empty'}">${esc(r.jam,'-')}</td>`;
      return `
      <tr>
        <td>${i+1}</td>
        ${showDate ? `<td>${esc(fmtTglShort(r.tgl))}</td>` : ''}
        <td>${esc(r.sesiLabel)}</td>
        ${kode}
        ${nama}
        ${bank}
        ${nominal}
        ${pelanggan}
        <td class="chk"><input type="checkbox" class="tf-cell-check" data-eid="${eid}" data-field="cekFinal" ${r.cekFinal?'checked':''} ${r.editable?'':'disabled'}></td>
        ${jam}
        <td class="chk">
          <div class="tf-row-actions">
            ${inline ? '' : `<button class="tf-icon-btn edit" data-act="edit-entry" data-sid="${sid}" data-eid="${eid}" title="Edit">${editSvg}</button>`}
            <button class="tf-icon-btn" data-act="delete-entry" data-sid="${sid}" data-eid="${eid}" data-nama="${esc(r.nama,'-')}" data-nominal="${esc(r.nominal||0)}" title="Hapus">${trashSvg}</button>
          </div>
        </td>
      </tr>`;
    }).join('');
    return `
      <div class="tf-excel-wrap">
        <table class="tf-excel">
          <thead><tr><th>#</th>${showDate?'<th>Tanggal</th>':''}<th>Sesi</th><th>Kode</th><th>Nama</th><th>Bank</th><th>Nominal</th><th>Pelanggan</th><th>✓</th><th>Jam</th><th></th></tr></thead>
          <tbody>${trs}</tbody>
        </table>
      </div>`;
  }

  // Simpan hasil edit langsung di sel tabel Riwayat (dipanggil saat sel selesai diedit / Enter / pindah sel).
  function refreshRiwayatTotals(){
    const grand = getCombinedRows().combined.reduce((a,r)=>a+(Number(r.nominal)||0),0);
    const n = document.querySelector('.tf-grandtotal .n');
    if(n) n.textContent = rupiah(grand);
  }
  function commitInlineEdit(t){
    const field = t.getAttribute('data-ie');
    if(['kode','nama','bank','nominal','pelanggan','jam'].indexOf(field)<0) return;
    const sess = sessions.find(x=>x.id===t.getAttribute('data-sid'));
    const entry = sess && sess.entries.find(e=>e.id===t.getAttribute('data-eid'));
    if(!entry) return;
    const tr = t.closest('tr');
    let val = String(t.value==null?'':t.value);
    val = field==='nominal' ? val.replace(/[^0-9]/g,'') : val.trim();
    const revert = function(){ t.value = field==='nominal' ? formatNominalDisplay(entry.nominal) : (entry[field]||''); };
    if(field==='bank' && BANK_LIST.indexOf(val)<0){ revert(); return; }
    if((field==='kode' || field==='nama') && !val){ revert(); toast('Kode dan nama tidak boleh kosong'); return; }
    if(field==='nominal' && !(Number(val)>0)){ revert(); toast('Nominal harus lebih dari 0'); return; }
    entry[field] = field==='jam' ? formatJam(val) : (field==='kode' ? formatKode(val) : val);
    if(field==='kode'){
      const match = lookupRiderName(val);   // sama seperti input di halaman lain: nama otomatis terisi dari kode
      if(match){
        entry.nama = match;
        const namaInput = tr ? Array.from(tr.querySelectorAll('.tf-ie')).find(x=>x.getAttribute('data-ie')==='nama') : null;
        if(namaInput) namaInput.value = match;
      }
    }
    t.value = field==='nominal' ? formatNominalDisplay(val) : entry[field];
    if(field==='jam'){ const td = t.closest('td'); if(td) td.classList.toggle('tf-jam-empty', !entry.jam); }
    save();
    refreshRiwayatTotals();
    toast('Tersimpan');
  }

  function dateNav(scope, value, allowAll){
    const has = !!value;
    const label = has ? formatFullDateID(value) : 'Semua tanggal';
    const notToday = has && value!==todayKey();
    return `
      <div class="tf-datebar">
        <div class="tf-datebar-row">
          <button class="tf-btn small" data-act="date-prev" data-scope="${scope}" title="Hari sebelumnya" ${has?'':'disabled'}>‹</button>
          <input type="date" class="tf-date-input" data-scope="${scope}" value="${esc(value)}">
          <button class="tf-btn small" data-act="date-next" data-scope="${scope}" title="Hari berikutnya" ${has?'':'disabled'}>›</button>
          <button class="tf-btn small" data-act="date-today" data-scope="${scope}">Hari ini</button>
          ${allowAll && has ? '<button class="tf-btn small" data-act="clear-date-filter">Semua tanggal</button>' : ''}
        </div>
        <div class="tf-datebar-label">${esc(label)}${notToday ? ' <span class="tf-date-warn">· bukan hari ini</span>' : ''}</div>
      </div>`;
  }
  // Saat transfer sedang dieksekusi (langkah 2-4) tanggal hanya ditampilkan, tidak bisa diganti, supaya tidak terpindah sesi tanpa sengaja.
  function berandaDateBar(s){
    if(s && s.step>=2 && s.step<=4){
      return `<div class="tf-datebar"><div class="tf-datebar-label readonly">${esc(formatFullDateID(berandaDate))}</div></div>`;
    }
    return dateNav('beranda', berandaDate, false);
  }

  function formatFullDateID(dateStr){
    const d = dateStr ? new Date(dateStr+'T00:00:00') : new Date();
    return d.toLocaleDateString('id-ID', {weekday:'long', day:'2-digit', month:'long', year:'numeric'});
  }

  // "deni prsetyo" -> "deni.p" ; "DEDI TRI KURNIAWAN" -> "DEDI.TK" ; satu kata dibiarkan.
  function shortName(nama){
    const words = String(nama==null?'':nama).trim().split(/\s+/).filter(Boolean);
    if(words.length<=1) return words[0]||'';
    const initials = words.slice(1).map(function(w){
      const m = w.match(/[\p{L}\p{N}]/u);
      return m ? m[0] : '';
    }).join('');
    return initials ? words[0]+'.'+initials : words[0];
  }
  // 'YYYY-MM-DD' -> 'dd/mm/yy'
  function fmtTglShort(k){
    return isValidDateKey(k) ? k.slice(8,10)+'/'+k.slice(5,7)+'/'+k.slice(2,4) : '';
  }

  // ---------- Cetak: 2 blok berdampingan (50 baris kiri + 50 baris kanan per halaman A4), mengikuti template Excel ----------
  const PRINT_PER_COL = 50, PRINT_PER_PAGE = 100;
  // Nominal untuk cetakan: angka saja dengan titik ribuan, tanpa 'Rp' (mis. 347.000)
  function angka(n){ return (Number(n)||0).toLocaleString('id-ID'); }

  // Ubah teks jam menjadi menit sejak 00:00. Menerima "09:01", "9.30", "0745", "7:5".
  // Kosong atau tidak valid (mis. "25:00", "pagi") -> null.
  function jamToMinutes(raw){
    const s = String(raw==null?'':raw).trim();
    if(!s) return null;
    let h, m;
    let x = s.match(/^(\d{1,2})\s*[:.]\s*(\d{1,2})$/);
    if(x){ h = Number(x[1]); m = Number(x[2]); }
    else if((x = s.match(/^(\d{3,4})$/))){ const v = x[1].padStart(4,'0'); h = Number(v.slice(0,2)); m = Number(v.slice(2)); }
    else if((x = s.match(/^(\d{1,2})$/))){ h = Number(x[1]); m = 0; }
    else return null;
    if(h>23 || m>59) return null;
    return h*60 + m;
  }
  // Urutan cetak: tanggal (kalau "Semua tanggal"), lalu jam dari yang terpagi.
  // Baris tanpa jam (atau jam tidak valid) ditaruh paling bawah pada tanggalnya. Urutan awal dijaga kalau jamnya sama.
  function sortForPrint(rows){
    return rows
      .map((r,i)=>({r, i, d:r.tgl||'', m:jamToMinutes(r.jam)}))
      .sort((a,b)=>
        (a.d<b.d?-1 : a.d>b.d?1 : 0)
        || ((a.m===null) - (b.m===null))
        || (a.m===null ? 0 : a.m - b.m)
        || (a.i - b.i))
      .map(x=>x.r);
  }

  function printHalf(rows, startNo, allDates){
    // lebar kolom (mm) total 97 per blok: NO, KODE, RIDER, BANK, NOMINAL, PELANGGAN, WAKTU
    const w = allDates ? [5.5,9,21,12,16,16.5,17] : [5.5,9,23.5,12.5,17,18,11.5];
    const colgroup = '<colgroup>' + w.map(x=>`<col style="width:${x}mm">`).join('') + '</colgroup>';
    let trs = '';
    for(let i=0;i<PRINT_PER_COL;i++){
      const r = rows[i], no = startNo+i;
      if(!r){
        trs += `<tr><td class="no">${no}</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
        continue;
      }
      const waktu = (allDates ? fmtTglShort(r.tgl).slice(0,5)+' ' : '') + (r.jam||'-');
      trs += `<tr>
        <td class="no">${no}</td>
        <td>${esc(r.kode,'-')}</td>
        <td class="${r.cekFinal?'tf-print-checked':''}">${esc(shortName(r.nama),'-')}</td>
        <td>${esc(r.bank)}</td>
        <td class="num">${angka(r.nominal)}</td>
        <td>${esc(r.pelanggan,'-')}</td>
        <td>${esc(waktu)}</td>
      </tr>`;
    }
    return `<table class="half">${colgroup}
      <thead><tr><th>NO</th><th>KODE</th><th>RIDER</th><th>BANK</th><th>NOMINAL</th><th>PELANGGAN</th><th>WAKTU</th></tr></thead>
      <tbody>${trs}</tbody></table>`;
  }

  function printRiwayat(){
    const rawRows = getCombinedRows().combined;
    if(!rawRows.length){ toast('Tidak ada data untuk dicetak'); return; }
    const combined = sortForPrint(rawRows);   // urut jam terpagi -> terakhir, tanpa jam di bawah
    const allDates = !riwayatDate;
    const headerDate = allDates ? 'Semua Tanggal' : formatFullDateID(riwayatDate);
    const notes = riwayatNotes.trim();

    // Tinggi baris mengecil otomatis hanya kalau Catatan panjang (satuan mm). Halaman A4, margin 6mm.
    const noteLines = notes ? notes.split('\n').reduce((a,l)=>a+Math.max(1,Math.ceil(l.length/130)),0) : 0;
    const notesH = notes ? 9 + noteLines*3.8 : 0;
    const rowH = Math.max(3.2, Math.min(5.4, (284 - 7 - 1 - 5 - 3 - notesH)/PRINT_PER_COL));
    const fs = Math.min(allDates ? 7 : 8, Math.max(5, rowH*2.835*0.55));
    const pages = Math.max(1, Math.ceil(combined.length/PRINT_PER_PAGE));

    let pagesHtml = '';
    for(let p=0;p<pages;p++){
      const base = p*PRINT_PER_PAGE;
      const left = combined.slice(base, base+PRINT_PER_COL);
      const right = combined.slice(base+PRINT_PER_COL, base+PRINT_PER_PAGE);
      pagesHtml += `<div class="pg">
        <div class="bar"><span>Hari Tanggal : ${esc(headerDate)}</span><span>Hal ${p+1}/${pages}</span></div>
        <div class="cols">${printHalf(left, base+1, allDates)}<div class="sep"></div>${printHalf(right, base+PRINT_PER_COL+1, allDates)}</div>
        ${(p===pages-1 && notes) ? `<div class="tf-print-notes"><div class="tf-print-notes-label">Catatan</div><div class="tf-print-notes-body">${esc(riwayatNotes).replace(/\n/g,'<br>')}</div></div>` : ''}
      </div>`;
    }

    const doc = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Riwayat Transfer</title>
      <style>
        @page{ size:A4 portrait; margin:6mm; }
        *{box-sizing:border-box; -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important;}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#000;margin:0;padding:0;}
        .pg{width:198mm;height:284mm;page-break-after:always;break-after:page;}
        .pg:last-child{page-break-after:auto;break-after:auto;}
        .bar{height:7mm;line-height:6.4mm;background:#FFFF00;border:0.25mm solid #000;font-weight:800;font-size:11pt;padding:0 2mm;display:flex;justify-content:space-between;text-transform:uppercase;}
        .cols{display:flex;align-items:stretch;margin-top:1mm;}
        .sep{width:4mm;flex:none;background:#A6A6A6;border-left:0.4mm solid #000;border-right:0.4mm solid #000;}
        table.half{width:97mm;flex:none;border-collapse:collapse;table-layout:fixed;font-size:${fs.toFixed(2)}pt;}
        table.half th, table.half td{border:0.2mm solid #000;padding:0 0.8mm;height:${rowH.toFixed(3)}mm;line-height:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        table.half th{background:#92D050;height:5mm;text-align:center;font-weight:700;font-size:${(fs*0.78).toFixed(2)}pt;}
        table.half td.no{text-align:center;font-size:${(fs*0.85).toFixed(2)}pt;padding:0;}
        table.half td.num{text-align:right;font-weight:800;font-size:${(fs*1.12).toFixed(2)}pt;font-variant-numeric:tabular-nums;letter-spacing:0.01em;padding-right:1.2mm;}
        table.half td.tf-print-checked{background:#FBDCB0;font-weight:700;color:#7A4A08;}
        .tf-print-notes{margin-top:2mm;font-size:9.5px;border:1px solid #999;border-radius:4px;padding:6px 8px;page-break-inside:avoid;}
        .tf-print-notes-label{font-weight:700;text-transform:uppercase;font-size:8px;color:#666;margin-bottom:3px;}
        .tf-print-notes-body{white-space:pre-wrap;line-height:1.4;}
      </style>
      </head><body>
      ${pagesHtml}
      </body></html>`;
    const old = document.getElementById('tf-print-frame');
    if(old) old.remove();
    const frame = document.createElement('iframe');
    frame.id = 'tf-print-frame';
    frame.style.position = 'fixed';
    frame.style.right = '0';
    frame.style.bottom = '0';
    frame.style.width = '0';
    frame.style.height = '0';
    frame.style.border = '0';
    document.body.appendChild(frame);
    const fdoc = frame.contentDocument || frame.contentWindow.document;
    fdoc.open();
    fdoc.write(doc);
    fdoc.close();
    const doPrint = function(){
      try{
        frame.contentWindow.focus();
        frame.contentWindow.print();
      }catch(e){ toast('Gagal membuka dialog cetak'); }
      setTimeout(()=>{ if(frame && frame.parentNode) frame.remove(); }, 1000);
    };
    // beri jeda singkat agar konten iframe selesai dirender sebelum dicetak,
    // tidak mengandalkan event onload yang kadang tidak terpicu ulang setelah document.write
    setTimeout(doPrint, 250);
  }

  function getCombinedRows(){
    const filtered = riwayatDate ? sessions.filter(s=>dateKey(s.createdAt)===riwayatDate) : sessions;
    const combined = [];
    filtered.forEach(s=>{
      s.entries.forEach(e=>{
        if(!e.kode.trim() || !e.nama.trim() || !(Number(e.nominal)>0)) return; // sembunyikan baris belum lengkap
        combined.push({...e, sesiLabel:sessionDisplayLabel(s), sesiId:s.id, tgl:dateKey(s.createdAt), editable: s.step!==5});
      });
    });
    return {filtered, combined};
  }

  function renderRiwayat(){
    const dateFilterBar = dateNav('riwayat', riwayatDate, true);
    if(sessions.length===0){
      return dateFilterBar + `<div class="tf-empty">Belum ada sesi. Mulai sesi pertama untuk mencatat transferan.</div>
        <div class="tf-actions"><button class="tf-btn primary" data-act="new-session">Mulai sesi</button></div>`;
    }
    const {filtered, combined} = getCombinedRows();
    if(filtered.length===0){
      return dateFilterBar + `<div class="tf-empty">Tidak ada sesi pada tanggal ini.</div>`;
    }

    const grand = combined.reduce((a,r)=>a+(Number(r.nominal)||0),0);

    return `
      ${dateFilterBar}
      <div class="tf-grandtotal">
        <div class="l">Total ${riwayatDate?'tanggal ini':'semua sesi'}</div>
        <div class="n">${rupiah(grand)}</div>
        <div class="l">${combined.length} transferan · ${filtered.length} sesi</div>
      </div>
      ${combined.length ? `<div class="tf-inline-bar">
          <span class="tf-inline-hint">${riwayatInline ? 'Mode edit: ketuk sel untuk mengubah. Tersimpan otomatis saat pindah sel atau tekan Enter.' : ''}</span>
          <button class="tf-btn small ${riwayatInline?'primary':''}" data-act="toggle-inline-edit">${riwayatInline ? '✓ Selesai edit' : '✎ Edit tabel'}</button>
        </div>` : ''}
      ${combined.length ? renderCombinedExcelTable(combined, !riwayatDate, riwayatInline) : '<div class="tf-empty">Belum ada transferan dengan kode, nama, dan nominal yang lengkap.</div>'}
      <div class="tf-card tf-notes-wrap">
        <label class="tf-notes-label" for="riwayat-notes">Catatan</label>
        <textarea id="riwayat-notes" rows="3" placeholder="Tulis catatan di sini...">${esc(riwayatNotes)}</textarea>
      </div>
    `;
  }
