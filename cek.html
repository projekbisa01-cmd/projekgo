<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://www.gstatic.com; connect-src https://*.googleapis.com; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Cek Status Mitra ProjekGo</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #24272C; color: #111827; font-family: Arial, Helvetica, sans-serif; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .kartu { background: #fff; border-radius: 22px; width: 100%; max-width: 380px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
  .kepala { background: #24272C; color: #fff; padding: 22px 24px 18px; border-bottom: 8px solid #FF8A1F; }
  .merek { font-size: 30px; font-weight: 900; letter-spacing: .5px; }
  .merek span { color: #FF8A1F; }
  .pt { font-size: 12px; font-weight: 700; margin-top: 4px; color: #D5D8DD; }
  .isi { padding: 24px; text-align: center; }
  .status { font-size: 22px; font-weight: 900; padding: 14px; border-radius: 14px; margin-bottom: 18px; }
  .ok { background: #D1FAE5; color: #065F46; }
  .tidak { background: #FEE2E2; color: #991B1B; }
  .tunggu { background: #F3F4F6; color: #374151; }
  .nama { font-size: 22px; font-weight: 900; text-transform: uppercase; word-break: break-word; }
  .rinci { font-size: 14px; font-weight: 700; color: #4B5563; margin-top: 6px; }
  .catatan { font-size: 12px; color: #4B5563; line-height: 1.5; margin-top: 18px; }
  .kaki { border-top: 1px solid #E5E7EB; padding: 14px 24px 20px; text-align: center; font-size: 12px; color: #4B5563; }
  .kaki b { display: block; font-size: 18px; color: #111827; margin-top: 2px; }
</style>
</head>
<body>
<div class="kartu">
  <div class="kepala">
    <div class="merek">PROJEK<span>GO</span></div>
    <div class="pt">PT. PROJEKGO SOLUSI UTAMA</div>
  </div>
  <div class="isi">
    <div id="status" class="status tunggu">Memeriksa...</div>
    <div id="nama" class="nama"></div>
    <div id="rinci" class="rinci"></div>
    <div id="catatan" class="catatan"></div>
  </div>
  <div class="kaki">Admin ProjekGo<b>0812-9280-2623</b></div>
</div>

<script type="module">
  // Halaman cek status mitra. Dibuka siapa pun yang memindai QR di ID Card rider.
  // Hanya membaca SATU dokumen kecil (uid, nama, tipe, aktif) berdasarkan kode acak di QR.
  // Semua isi ditulis lewat textContent, jadi tidak ada teks yang bisa dijalankan sebagai kode.
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
  import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

  const elStatus = document.getElementById('status');
  const elNama = document.getElementById('nama');
  const elRinci = document.getElementById('rinci');
  const elCatatan = document.getElementById('catatan');
  const tampil = (kelas, teks, nama, rinci, catatan) => {
    elStatus.className = 'status ' + kelas;
    elStatus.textContent = teks;
    elNama.textContent = nama || '';
    elRinci.textContent = rinci || '';
    elCatatan.textContent = catatan || '';
  };

  const kode = new URLSearchParams(window.location.search).get('k') || '';
  if (!/^[A-Za-z0-9]{24}$/.test(kode)) {
    tampil('tidak', 'KARTU TIDAK DIKENALI', '', '', 'Kode pada kartu ini tidak sah. Hubungi admin ProjekGo untuk memastikan.');
  } else {
    try {
      const app = initializeApp({
        apiKey: 'AIzaSyBCp2PBN1ASET6QjuQ3PWdC1gysQv0z_OY',
        authDomain: 'onbid-2f87a.firebaseapp.com',
        projectId: 'onbid-2f87a'
      });
      const snap = await getDoc(doc(getFirestore(app), 'artifacts', 'onbid-2f87a', 'public', 'data', 'kartu_mitra', kode));
      if (!snap.exists()) {
        tampil('tidak', 'KARTU TIDAK DIKENALI', '', '', 'Kartu ini tidak terdaftar di ProjekGo. Hubungi admin untuk memastikan.');
      } else {
        const d = snap.data();
        const nama = String(d.nama || '').slice(0, 60);
        const rinci = 'ID ' + String(d.uid || '-').slice(0, 64) + ' · ' + (d.tipe === 'parttime' ? 'Rider Part Time' : 'Rider Fulltime');
        if (d.aktif === true) tampil('ok', 'MITRA AKTIF', nama, rinci, 'Rider ini terdaftar resmi sebagai mitra rider ProjekGo.');
        else tampil('tidak', 'BUKAN MITRA AKTIF', nama, rinci, 'Kartu ini sudah tidak berlaku. Pemegang kartu saat ini bukan mitra aktif ProjekGo.');
      }
    } catch (e) {
      console.error(e);
      tampil('tunggu', 'GAGAL MEMERIKSA', '', '', 'Periksa koneksi internet lalu muat ulang halaman ini.');
    }
  }
</script>
</body>
</html>
